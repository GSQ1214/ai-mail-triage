[project]
name = "ai-mail-triage"
version = "1.0.0"
description = "使用 Ollama 結構化輸出進行客服信件分類"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mail-triage = "mail_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_triage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
